name: Publish CLI (specguard-ai)

on:
  push:
    branches: [main]
    paths:
      - 'package.json'

jobs:
  publish:
    name: npm publish
    runs-on: ubuntu-latest
    # Only run when the version in package.json has actually changed
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Detect version bump
        id: version
        run: |
          PREV=$(git show HEAD~1:package.json 2>/dev/null | node -p "JSON.parse(require('fs').readFileSync('/dev/stdin','utf8')).version" 2>/dev/null || echo "0.0.0")
          CURR=$(node -p "require('./package.json').version")
          echo "prev=$PREV"
          echo "curr=$CURR"
          if [ "$PREV" = "$CURR" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Skip if version unchanged
        if: steps.version.outputs.changed == 'false'
        run: echo "Version unchanged — skipping publish."

      - uses: actions/setup-node@v4
        if: steps.version.outputs.changed == 'true'
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'
          cache: 'npm'

      - name: Install
        if: steps.version.outputs.changed == 'true'
        run: npm ci

      - name: Lint
        if: steps.version.outputs.changed == 'true'
        run: npm run lint

      - name: Test
        if: steps.version.outputs.changed == 'true'
        run: npm test

      - name: Build
        if: steps.version.outputs.changed == 'true'
        run: npm run build

      - name: Publish to npm
        if: steps.version.outputs.changed == 'true'
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
