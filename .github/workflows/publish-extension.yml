name: Publish VS Code Extension

on:
  push:
    branches: [main]
    paths:
      - 'extension/package.json'

jobs:
  publish:
    name: vsce publish
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: extension
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Detect version bump
        id: version
        run: |
          PREV=$(git show HEAD~1:extension/package.json 2>/dev/null | node -p "JSON.parse(require('fs').readFileSync('/dev/stdin','utf8')).version" 2>/dev/null || echo "0.0.0")
          CURR=$(node -p "require('./package.json').version")
          echo "prev=$PREV"
          echo "curr=$CURR"
          if [ "$PREV" = "$CURR" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Skip if version unchanged
        if: steps.version.outputs.changed == 'false'
        run: echo "Version unchanged — skipping publish."

      - uses: actions/setup-node@v4
        if: steps.version.outputs.changed == 'true'
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: extension/package-lock.json

      - name: Install extension deps
        if: steps.version.outputs.changed == 'true'
        run: npm ci

      - name: Install webview deps
        if: steps.version.outputs.changed == 'true'
        run: npm --prefix webview install

      - name: Lint
        if: steps.version.outputs.changed == 'true'
        run: npm run lint

      - name: Build
        if: steps.version.outputs.changed == 'true'
        run: npm run build

      - name: Package VSIX
        if: steps.version.outputs.changed == 'true'
        run: npx vsce package

      - name: Publish to VS Code Marketplace
        if: steps.version.outputs.changed == 'true'
        run: npx vsce publish --no-git-tag-version
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
