name: Release

# Tag-driven. Pushing a tag like v0.2.0 publishes the CLI (npm: specguard-ai) and the
# VS Code extension together, at the tag's version, and creates a GitHub release.
#
#   npm version 0.2.0 --no-git-tag-version
#   git commit -am "chore: release 0.2.0" && git tag v0.2.0 && git push --follow-tags
#
# npm: trusted publishing (OIDC), configured on npmjs.com; no NPM_TOKEN. Extension: VSCE_PAT. Optional: OVSX_PAT (Open VSX).
# The extension marketplace rejects a lower version than the one it has, so the
# first combined release must be above the extension's current version.

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+-*'

permissions:
  contents: write
  id-token: write

jobs:
  verify:
    name: Verify the tag and run every gate
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: The tag must equal the package.json version
        id: version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG=$(node -p "require('./package.json').version")
          if [ "$TAG" != "$PKG" ]; then
            echo "::error::Tag v$TAG does not match package.json version $PKG. Run 'npm version $TAG --no-git-tag-version' and re-tag."
            exit 1
          fi
          echo "version=$PKG" >> "$GITHUB_OUTPUT"
          case "$PKG" in *-*) echo "prerelease=true" >> "$GITHUB_OUTPUT" ;; *) echo "prerelease=false" >> "$GITHUB_OUTPUT" ;; esac

      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build

      - name: Extension — install, lint, test
        working-directory: extension
        run: |
          npm ci
          npm --prefix webview install
          node scripts/sync-version.mjs "${{ steps.version.outputs.version }}"
          npm run lint
          npm test

  publish-cli:
    name: Publish specguard-ai to npm
    needs: verify
    runs-on: ubuntu-latest
    # npm trusted publishing: the job's OIDC identity (id-token: write, above) is the credential, so there is no
    # npm token to create, rotate or leak. Set up once on npmjs.com: package specguard-ai > Settings > Trusted
    # Publisher > GitHub Actions > jazzmind / specguard / release.yml. It needs npm >= 11.5.1 and Node >= 22.14,
    # a public repo whose URL matches package.json "repository", and a cloud-hosted runner.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
      - name: npm must be new enough for trusted publishing
        run: |
          npm install -g npm@^11.5.1
          npm --version
      - run: npm ci
      - run: npm run build
      - name: Publish (OIDC; provenance is attached automatically)
        run: |
          if [ "${{ needs.verify.outputs.prerelease }}" = "true" ]; then TAGARG="--tag next"; else TAGARG=""; fi
          npm publish --access public $TAGARG

  publish-extension:
    name: Publish the VS Code extension
    # After the CLI, so an extension that expects this CLI version never ships before it exists.
    # Off until the repository variable PUBLISH_EXTENSION is set to "true" (Settings > Variables), so a release without
    # Marketplace credentials still publishes the CLI and creates the GitHub release.
    if: ${{ vars.PUBLISH_EXTENSION == 'true' }}
    needs: [verify, publish-cli]
    runs-on: ubuntu-latest
    env:
      OVSX_PAT: ${{ secrets.OVSX_PAT }}
    defaults:
      run:
        working-directory: extension
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: extension/package-lock.json
      - name: CLI dependencies (the extension bundles the CLI source)
        working-directory: .
        run: npm ci
      - run: npm ci
      - run: npm --prefix webview install
      - name: The extension takes the tag version
        run: node scripts/sync-version.mjs "${{ needs.verify.outputs.version }}"
      - name: Build (the bundled CLI and the host both embed this version)
        run: npm run build
      - name: Package
        run: npx vsce package --no-git-tag-version --no-update-package-json -o specguard-${{ needs.verify.outputs.version }}.vsix
      - name: Publish to the VS Code Marketplace
        run: |
          if [ "${{ needs.verify.outputs.prerelease }}" = "true" ]; then PRE="--pre-release"; else PRE=""; fi
          npx vsce publish --packagePath specguard-${{ needs.verify.outputs.version }}.vsix $PRE
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
      - name: Publish to Open VSX
        if: ${{ env.OVSX_PAT != '' }}
        run: npx ovsx publish specguard-${{ needs.verify.outputs.version }}.vsix
      - uses: actions/upload-artifact@v4
        with:
          name: vsix
          path: extension/specguard-${{ needs.verify.outputs.version }}.vsix

  github-release:
    name: GitHub release
    needs: [verify, publish-cli, publish-extension]
    # Runs when the CLI was published, whether or not the extension job ran.
    if: ${{ !cancelled() && needs.publish-cli.result == 'success' && needs.publish-extension.result != 'failure' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        if: ${{ needs.publish-extension.result == 'success' }}
        with:
          name: vsix
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ needs.verify.outputs.prerelease }}" = "true" ]; then PRE="--prerelease"; else PRE=""; fi
          gh release create "$GITHUB_REF_NAME" $(ls specguard-*.vsix 2>/dev/null) --repo "$GITHUB_REPOSITORY" --generate-notes --title "SpecGuard ${{ needs.verify.outputs.version }}" $PRE
